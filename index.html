<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Pribadi dengan Sistem Akun</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .hidden { display: none !important; }

        /* Auth Styles */
        .auth-box h2 { color: var(--primary-color); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;
        }
        .btn {
            background-color: var(--primary-color); color: white; border: none;
            padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%;
            font-size: 0.95rem; font-weight: 600; transition: background 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #6b7280; margin-top: 8px; }
        .btn-secondary:hover { background-color: #4b5563; }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 10px; text-align: center; }

        /* Calendar Styles */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .calendar-header h2 { margin: 0; font-size: 1.1rem; color: var(--primary-color); }
        .calendar-header button { background: var(--primary-color); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        
        .user-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #eef2ff; padding: 8px 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.85rem;
        }
        .user-bar button { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; font-size: 0.8rem; color: #6b7280; margin-bottom: 8px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        
        .day-cell {
            background-color: #f9fafb; border: 1px solid var(--border-color); border-radius: 6px;
            min-height: 55px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
        }
        .day-cell:hover { border-color: var(--primary-color); background: #f0fdf4; }
        .day-cell.empty { background: transparent; border: none; cursor: default; }
        .day-number { font-size: 0.8rem; font-weight: bold; }
        .day-content { font-size: 0.65rem; color: #4b5563; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .day-cell.checked { background-color: #ecfdf5; border-color: #10b981; }
        .day-cell.checked .day-number { color: #047857; text-decoration: line-through; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 320px; }
        .modal-content textarea { width: 100%; height: 70px; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; resize: none; box-sizing: border-box; margin-bottom: 10px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-actions button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SEKSI LOGIN / REGISTER -->
        <div id="authSection" class="auth-box">
            <h2>Kalender Pribadi</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="nama@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="Minimal 6 karakter">
            </div>
            <button class="btn" id="loginBtn">Login</button>
            <button class="btn btn-secondary" id="registerBtn">Daftar Akun Baru</button>
            <div class="error-msg" id="authError"></div>
        </div>

        <!-- SEKSI KALENDER UTAMA -->
        <div id="calendarSection" class="hidden">
            <div class="user-bar">
                <span id="userEmailDisplay"></span>
                <button id="logoutBtn">Logout</button>
            </div>

            <div class="calendar-header">
                <button id="prevBtn">&lt;</button>
                <h2 id="monthYearDisplay"></h2>
                <button id="nextBtn">&gt;</button>
            </div>

            <div class="weekdays">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- MODAL CATATAN -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle" style="margin-top:0; font-size:1rem;">Atur Tanggal</h3>
            <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; margin-bottom:10px; cursor:pointer;">
                <input type="checkbox" id="modalCheck"> Selesai / Checklist
            </label>
            <textarea id="modalNote" placeholder="Tulis catatan..."></textarea>
            <div class="modal-actions">
                <button style="background:#e5e7eb;" id="cancelModal">Batal</button>
                <button style="background:var(--primary-color); color:white;" id="saveModal">Simpan</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE DAN APLIKASI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ganti konfigurasi di bawah ini dengan milik Anda dari Firebase Console
        const firebaseConfig = {
    apiKey: "AIzaSyAKL...",
    authDomain: "kalenderpribadi-426e6.firebaseapp.com",
    projectId: "kalenderpribadi-426e6",
    storageBucket: "kalenderpribadi-426e6.firebasestorage.app",
    messagingSenderId: "17087847576",
    appId: "1:17087847576:web:d86c49de6bbcbed992c4ed"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentDate = new Date();
        let userCalendarData = {};
        let selectedDateKey = '';

        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // DOM Elements
        const authSection = document.getElementById('authSection');
        const calendarSection = document.getElementById('calendarSection');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const authError = document.getElementById('authError');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const daysGrid = document.getElementById('daysGrid');
        
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const modalCheck = document.getElementById('modalCheck');
        const modalNote = document.getElementById('modalNote');

        // Deteksi Status Sesi Login Pengguna
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                calendarSection.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                
                // Ambil data dari database Firestore berdasarkan UID pengguna
                await fetchUserData(user.uid);
                renderCalendar();
            } else {
                currentUser = null;
                authSection.classList.remove('hidden');
                calendarSection.classList.add('hidden');
                userCalendarData = {};
            }
        });

        // Event Tombol Auth
        document.getElementById('registerBtn').addEventListener('click', () => {
            authError.textContent = '';
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch(err => authError.textContent = err.message);
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            authError.textContent = '';
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch(err => authError.textContent = 'Gagal login: Periksa email & password.');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // Ambil Data dari Firestore
        async function fetchUserData(uid) {
            try {
                const docRef = doc(db, "calendars", uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    userCalendarData = docSnap.data();
                } else {
                    userCalendarData = {};
                    await setDoc(docRef, {});
                }
            } catch (e) {
                console.error("Gagal mengambil data:", e);
            }
        }

        // Simpan Data ke Firestore
        async function saveUserData() {
            if (!currentUser) return;
            try {
                const docRef = doc(db, "calendars", currentUser.uid);
                await setDoc(docRef, userCalendarData);
            } catch (e) {
                console.error("Gagal menyimpan data:", e);
            }
        }

        // Render Kalender
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearDisplay.textContent = `${months[month]} ${year}`;
            daysGrid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                daysGrid.appendChild(empty);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = userCalendarData[dateKey] || { checked: false, note: '' };

                if (dayData.checked) {
                    cell.classList.add('checked');
                }

                cell.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-content">${dayData.note}</div>
                `;

                cell.addEventListener('click', () => {
                    selectedDateKey = dateKey;
                    modalDateTitle.textContent = `${day} ${months[month]} ${year}`;
                    modalCheck.checked = dayData.checked;
                    modalNote.value = dayData.note;
                    noteModal.style.display = 'flex';
                });

                daysGrid.appendChild(cell);
            }
        }

        // Modal Action Listener
        document.getElementById('cancelModal').addEventListener('click', () => {
            noteModal.style.display = 'none';
        });

        document.getElementById('saveModal').addEventListener('click', async () => {
            userCalendarData[selectedDateKey] = {
                checked: modalCheck.checked,
                note: modalNote.value.trim()
            };
            noteModal.style.display = 'none';
            renderCalendar();
            await saveUserData(); // Simpan otomatis ke Cloud Database
        });

        // Navigasi Bulan
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });
    </script>
</body>
</html>
